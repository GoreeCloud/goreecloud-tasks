name: goreecloud-tasks-private-publication

services:
  db:
    image: postgres:17.10-bookworm@sha256:4f736ae292687621d4dbe0d499ffd024a36bd2ee7d8ca6f2ccd4c800f047b394
    environment:
      TZ: ${TZ:-America/Chicago}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"'
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  web:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - ../.env
    environment:
      DATABASE_ENGINE: postgresql
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      DJANGO_SECRET_KEY_FILE: /run/secrets/django_secret_key
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: tasks.goreecloud.com
      DJANGO_CSRF_TRUSTED_ORIGINS: https://tasks.goreecloud.com
      DJANGO_SECURE_COOKIES: "true"
      DJANGO_SECURE_SSL_REDIRECT: "true"
      TASKS_BASE_URL: https://tasks.goreecloud.com
    secrets:
      - postgres_password
      - django_secret_key
    group_add:
      - "${APP_SECRET_GID}"
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    networks:
      backend:
      proxy:
        aliases:
          - goreecloud-tasks
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          request=urllib.request.Request('http://127.0.0.1:8000/health/', headers={'Host':'tasks.goreecloud.com','X-Forwarded-Proto':'https'});
          urllib.request.urlopen(request, timeout=3)
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  caddy:
    image: caddy:2.11.4@sha256:844f60b64e4724a5aa8245e019dace0d3f199f7433ce6c57676cb30a920dbad9
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - ./private_publication.Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      proxy:
      approved_ingress:
        aliases:
          - tasks.goreecloud.com
      unapproved_ingress:
        aliases:
          - tasks.goreecloud.com
    healthcheck:
      test:
        - CMD
        - caddy
        - validate
        - --config
        - /etc/caddy/Caddyfile
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  approved-client:
    image: python:3.13.14-slim-bookworm@sha256:9d7f287598e1a5a978c015ee176d8216435aaf335ed69ac3c38dd1bbb10e8d64
    command:
      - python
      - -c
      - import time; time.sleep(3600)
    volumes:
      - ./private_publication_client.py:/client.py:ro
    networks:
      approved_ingress:
        ipv4_address: 100.100.0.10

  unapproved-client:
    image: python:3.13.14-slim-bookworm@sha256:9d7f287598e1a5a978c015ee176d8216435aaf335ed69ac3c38dd1bbb10e8d64
    command:
      - python
      - -c
      - import time; time.sleep(3600)
    volumes:
      - ./private_publication_client.py:/client.py:ro
    networks:
      unapproved_ingress:
        ipv4_address: 172.30.240.10

secrets:
  postgres_password:
    file: ../secrets/postgres_password
  django_secret_key:
    file: ../secrets/django_secret_key

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  backend:
    internal: true
    ipam:
      config:
        - subnet: 172.30.243.0/24
  proxy:
    internal: true
    ipam:
      config:
        - subnet: 172.30.242.0/24
  approved_ingress:
    internal: true
    ipam:
      config:
        - subnet: 100.100.0.0/24
  unapproved_ingress:
    internal: true
    ipam:
      config:
        - subnet: 172.30.240.0/24
