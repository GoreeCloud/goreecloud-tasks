{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}GoreeCloud Tasks{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{% url 'tasks:dashboard' %}">GoreeCloud Tasks</a>
    {% if user.is_authenticated %}
      <div class="account">
        <span>{{ user.preferred_name }}</span>
        <form method="post" action="{% url 'logout' %}">
          {% csrf_token %}
          <button class="text-button" type="submit">Sign out</button>
        </form>
      </div>
    {% endif %}
  </header>

  {% if messages %}
    <div class="flash-region" aria-live="polite">
      {% for message in messages %}
        <div class="notice {{ message.tags|default:'info' }}">{{ message }}</div>
      {% endfor %}
    </div>
  {% endif %}

  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
