<form class="quick-add" method="post" action="{% url 'tasks:quick_add' %}">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  <div class="quick-add-main">
    {{ quick_add_form.title }}
    <button class="primary-button compact" type="submit">Add task</button>
  </div>
  <div class="quick-add-options">
    <label>
      <span>Location</span>
      {{ quick_add_form.project }}
    </label>
    <label>
      <span>Priority</span>
      {{ quick_add_form.priority }}
    </label>
    <label>
      <span>Due</span>
      {{ quick_add_form.due_at }}
    </label>
    <a class="secondary-link" href="{% url 'tasks:task_create' %}">Full editor</a>
  </div>
</form>
