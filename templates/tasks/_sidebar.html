<nav class="sidebar task-sidebar" aria-label="Task navigation">
  <a class="sidebar-capture" href="{% url 'tasks:task_create' %}">
    <span class="sidebar-capture-mark" aria-hidden="true">+</span>
    <span>New task</span>
  </a>

  <form class="sidebar-search" method="get" action="{% url 'tasks:search' %}" role="search">
    <label class="sr-only" for="sidebar-search-query">Search tasks</label>
    <input id="sidebar-search-query" name="q" type="search" value="{{ search_query|default:'' }}" placeholder="Search tasks" autocomplete="off">
  </form>

  <section class="nav-cluster" aria-labelledby="task-nav-plan">
    <h2 id="task-nav-plan" class="nav-heading">Plan</h2>
    <a class="nav-item{% if active_view == 'inbox' %} active{% endif %}" href="{% url 'tasks:dashboard' %}">Inbox</a>
    <a class="nav-item{% if active_view == 'today' %} active{% endif %}" href="{% url 'tasks:today' %}">Today</a>
    <a class="nav-item{% if active_view == 'upcoming' %} active{% endif %}" href="{% url 'tasks:upcoming' %}">Upcoming</a>
    <a class="nav-item{% if active_view == 'overdue' %} active{% endif %}" href="{% url 'tasks:overdue' %}">Overdue</a>
  </section>

  <section class="nav-cluster" aria-labelledby="task-nav-organize">
    <h2 id="task-nav-organize" class="nav-heading">Organize</h2>
    <a class="nav-item{% if active_view == 'projects' %} active{% endif %}" href="{% url 'projects:list' %}">Projects</a>
    <a class="nav-item{% if active_view == 'labels' %} active{% endif %}" href="{% url 'labels:list' %}">Labels</a>
  </section>

  <section class="nav-cluster" aria-labelledby="task-nav-collaborate">
    <h2 id="task-nav-collaborate" class="nav-heading">Collaborate</h2>
    <a class="nav-item{% if active_view == 'shared-work' %} active{% endif %}" href="{% url 'tasks:shared_work' %}">Shared Work</a>
    <a class="nav-item{% if active_view == 'goreecloud-work' %} active{% endif %}" href="{% url 'tasks:goreecloud_work' %}">GoreeCloud Work</a>
  </section>

  <div class="sidebar-footer">
    <a class="nav-item{% if active_view == 'notifications' %} active{% endif %}" href="{% url 'notifications:settings' %}">Notifications</a>
    <a class="nav-item" href="{% url 'portability:index' %}">Data &amp; portability</a>
  </div>
</nav>
