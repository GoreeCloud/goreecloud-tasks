name: Calendar Busy Contract

on:
  push:
    branches:
      - main
      - "agent/**"
      - "feature/**"
      - "fix/**"
      - "security/**"
  pull_request:

permissions:
  contents: read

jobs:
  live-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out exact Tasks candidate revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Check out pinned Calendar busy-time provider candidate
        uses: actions/checkout@v6
        with:
          repository: GoreeCloud/goreecloud-calendar
          ref: c7e40faa1357cd6befe4c6afc2c564fa06f86724
          path: calendar-source
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.14"
          cache: pip

      - name: Install Tasks dependencies
        run: |
          python -m pip install --requirement requirements.txt
          python -m pip check

      - name: Validate live privacy-minimized Calendar busy-time contract
        env:
          CALENDAR_REPO_DIR: ${{ github.workspace }}/calendar-source
        run: python tests/validate_calendar_busy_candidate_live.py
