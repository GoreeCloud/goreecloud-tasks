name: Full Environment Recovery Readiness

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:

permissions:
  contents: read

jobs:
  full-environment-recovery-readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Validate full-environment recovery readiness
        run: bash scripts/validate_full_environment_recovery_readiness.sh
