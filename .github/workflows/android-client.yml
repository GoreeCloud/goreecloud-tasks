name: Android Client CI

on:
  push:
    branches: [main]
    paths:
      - 'clients/android/**'
      - 'docs/glaze-ui-v1.4-android-adoption.md'
      - 'scripts/validate_android_native_foundation.py'
      - '.github/workflows/android-client.yml'
  pull_request:
    paths:
      - 'clients/android/**'
      - 'docs/glaze-ui-v1.4-android-adoption.md'
      - 'scripts/validate_android_native_foundation.py'
      - '.github/workflows/android-client.yml'

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Validate native authority boundary
        working-directory: .
        run: python3 scripts/validate_android_native_foundation.py
      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Assemble debug
        run: gradle :app:assembleDebug --stacktrace
