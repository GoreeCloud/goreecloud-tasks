name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
      - "security/**"
      - "scaffold/**"
      - "agent/**"
  pull_request:

permissions:
  contents: read

jobs:
  django:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DJANGO_SECRET_KEY: ci-only-nonproduction-key
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DATABASE_ENGINE: sqlite

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.14"
          cache: pip

      - name: Validate Glaze UI consumer source contract
        run: python scripts/validate_glaze_ui_consumer.py

      - name: Install dependencies
        run: |
          python -m pip install --requirement requirements.txt
          python -m pip check

      - name: Run Django system checks
        run: python manage.py check

      - name: Verify migrations are current
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python manage.py test

  ntfy-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --requirement requirements.txt
          python -m pip check

      - name: Validate disposable ntfy ACL and live Tasks delivery
        run: bash scripts/validate_ntfy_integration.sh

  manager-cross-app:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out GoreeCloud Tasks
        uses: actions/checkout@v6

      - name: Check out pinned GoreeCloud Manager integration revision
        uses: actions/checkout@v6
        with:
          repository: GoreeCloud/goreecloud-manager
          ref: b4bc055aa6b4143a61a8073442fc9ba311b3e53e
          path: manager-source
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.14"

      - name: Create isolated Tasks and Manager environments
        run: |
          python -m venv .venv-tasks
          python -m venv .venv-manager
          .venv-tasks/bin/python -m pip install --requirement requirements.txt
          .venv-tasks/bin/python -m pip check
          .venv-manager/bin/python -m pip install --requirement manager-source/requirements.txt
          .venv-manager/bin/python -m pip check

      - name: Validate live Tasks and Manager authorization contract
        env:
          MANAGER_REPO_DIR: ${{ github.workspace }}/manager-source
          TASKS_PYTHON: ${{ github.workspace }}/.venv-tasks/bin/python
          MANAGER_PYTHON: ${{ github.workspace }}/.venv-manager/bin/python
        run: bash scripts/validate_manager_cross_app.sh

  manager-final-topology:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out GoreeCloud Tasks
        uses: actions/checkout@v6

      - name: Check out pinned GoreeCloud Manager production-readiness revision
        uses: actions/checkout@v6
        with:
          repository: GoreeCloud/goreecloud-manager
          ref: b4bc055aa6b4143a61a8073442fc9ba311b3e53e
          path: manager-source
          persist-credentials: false

      - name: Validate disposable production-pattern Tasks and Manager topology
        env:
          MANAGER_REPO_DIR: ${{ github.workspace }}/manager-source
        run: bash scripts/validate_manager_final_topology.sh

  backup-restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate disposable PostgreSQL backup and restoration
        run: bash scripts/validate_backup_restore.sh

  upgrade-rollback:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out exact candidate revision with full history
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate disposable upgrade and backup-backed rollback
        env:
          UPGRADE_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          UPGRADE_TARGET_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/validate_upgrade_rollback.sh

  docker-compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Prepare isolated CI configuration
        run: |
          cp .env.example .env
          mkdir -p secrets
          printf '%s\n' 'ci-only-django-secret-not-for-production' > secrets/django_secret_key
          printf '%s\n' 'ci-only-postgres-password' > secrets/postgres_password
          chmod 600 .env
          sudo chgrp 20001 secrets/django_secret_key secrets/postgres_password
          chmod 640 secrets/django_secret_key secrets/postgres_password

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build application image
        run: docker compose build

      - name: Start PostgreSQL and apply migrations
        run: |
          docker compose up -d db
          docker compose run --rm web python manage.py migrate --noinput

      - name: Start application and verify health
        run: |
          docker compose up -d web
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error http://127.0.0.1:8000/health/; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs web db
          exit 1

      - name: Show final container state
        if: always()
        run: docker compose ps

      - name: Stop isolated stack
        if: always()
        run: docker compose down --volumes --remove-orphans
